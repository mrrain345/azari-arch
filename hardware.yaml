packages:
  # Hardware
  - linux-headers
  - fwupd
  - lshw
  - intel-ucode
  - power-profiles-daemon

  # Network & Bluetooth
  - networkmanager
  - bluez

  # Printer
  - cups
  - cups-filters
  - cups-pdf
  - hplip
  - avahi
  - nss-mdns

  # Graphics
  - mesa
  - mesa-utils
  - nvidia-open-dkms
  - nvidia-utils
  - nvidia-prime
  - libva-nvidia-driver
  - intel-media-driver
  - libva-utils
  - vulkan-intel
  - vulkan-mesa-layers
  - vulkan-tools

  # Video Codecs
  - gstreamer
  - gst-plugins-base
  - gst-plugins-good
  - gst-plugins-bad
  - gst-plugins-ugly
  - gst-libav

  # Audio
  - pipewire
  - pipewire-audio
  - pipewire-alsa
  - pipewire-pulse
  - pipewire-jack
  - wireplumber
  - pavucontrol
  - sof-firmware

systemd:
  - NetworkManager
  - fwupd
  - cups
  - bluetooth
  - power-profiles-daemon
  - avahi-daemon
  - nvidia-suspend
  - nvidia-hibernate
  - nvidia-resume

postinstall:
  - env NVIDIA_VERSION=$(pacman -Q nvidia-open-dkms | cut -d ' ' -f 2 | cut -d '-' -f 1)
    KERNEL_VERSION=$(pacman -Q linux | cut -d ' ' -f 2 | sed 's/\.arch/-arch/')
    bash -c 'mkdir -p /usr/lib/modules/$KERNEL_VERSION/extramodules/ &&
    cp -r /var/lib/dkms/nvidia/$NVIDIA_VERSION/$KERNEL_VERSION/x86_64/module/* /usr/lib/modules/$KERNEL_VERSION/extramodules/ &&
    depmod -a -b /usr $KERNEL_VERSION && rm -rf /var/lib/dkms/nvidia'
